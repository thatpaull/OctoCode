<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Kurse - OctoCode</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="dashboard.css" />
	<style>
		.courses-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
			gap: 20px;
			margin-top: 24px;
		}
		.course-card {
			background: white;
			border-radius: 14px;
			padding: 20px;
			box-shadow: var(--shadow);
			transition: transform 0.2s, box-shadow 0.2s;
		}
		.course-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 12px 40px rgba(16,24,40,0.12);
		}
		.course-card.enrolled {
			border: 2px solid var(--success);
			background: linear-gradient(180deg, #f0fdf4, #ffffff);
		}
		.course-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 12px;
		}
		.enroll-btn {
			padding: 8px 16px;
			border: none;
			border-radius: 8px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s;
			font-size: 13px;
		}
		.enroll-btn.primary {
			background: var(--accent);
			color: white;
		}
		.enroll-btn.primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(37,99,235,0.3);
		}
		.enroll-btn.enrolled {
			background: var(--success);
			color: white;
		}
		.enroll-btn.enrolled:hover {
			background: #dc2626;
		}
		.tabs {
			display: flex;
			gap: 12px;
			margin-bottom: 24px;
		}
		.tab {
			padding: 10px 20px;
			background: transparent;
			border: 2px solid #e2e8f0;
			border-radius: 10px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s;
		}
		.tab.active {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}
	</style>
</head>
<body>
<div class="app">
	<aside class="sidebar" aria-label="Navbar">
		<div class="brand">
			<div class="logo">OC</div>
			<div class="brand-text">
				<div class="name">OctoCode</div>
				<div class="sub">Premium</div>
			</div>
		</div>

		<nav class="nav">
			<ul>
				<li class="nav-item" onclick="window.location.href='dashboard.html'">Dashboard</li>
				<li class="nav-item active" aria-current="page">Kurse</li>
				<li class="nav-item">Bewertungen</li>
				<li class="nav-item" onclick="window.location.href='ai.html'">AI</li>
				<li class="nav-item" onclick="window.location.href='freunde.html'">Freunde</li>
				<li class="nav-item" onclick="window.location.href='einstellungen.html'">Einstellungen</li>
			</ul>
		</nav>

		<div class="sidebar-footer">
			<div class="theme-switch">
				<label class="switch">
					<input id="themeToggle" type="checkbox">
					<span class="slider"></span>
				</label>
				<small>Dunkles Thema</small>
			</div>
			<div class="profile">
				<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="avatar" />
				<div>
					<div class="prof-name">Laden...</div>
					<div class="prof-score">0 Punkte</div>
				</div>
			</div>
		</div>
	</aside>

	<main class="main">
		<header class="main-header">
			<div>
				<h1>📚 Kurse</h1>
				<p class="muted">Entdecke spannende Programmierkurse!</p>
			</div>
		</header>

		<div class="tabs">
			<button class="tab active" onclick="filterCourses('all')">Alle Kurse</button>
			<button class="tab" onclick="filterCourses('enrolled')">Meine Kurse</button>
			<button class="tab" onclick="filterCourses('available')">Verfügbare Kurse</button>
		</div>

		<div class="courses-grid" id="coursesContainer">
			<div style="text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1;">
				<div style="font-size: 48px; margin-bottom: 12px;">📚</div>
				<p>Lade Kurse...</p>
			</div>
		</div>

		<footer class="footer">
			<div>© OctoCode – 2025</div>
		</footer>
	</main>
</div>

<script>
let currentUser = null;
let allCourses = [];
let enrolledCourseIds = [];
let currentFilter = 'all';

async function loadAuth() {
	try {
		console.log('Prüfe Authentifizierung...');
		const res = await fetch('/api/check-auth', { credentials: 'include' });
		const data = await res.json();

		if (data.authenticated) {
			currentUser = data.user;
			document.querySelector('.prof-name').textContent = currentUser.name;
			document.querySelector('.prof-score').textContent = `${currentUser.points || 0} Punkte`;

			let avatarUrl = currentUser.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(currentUser.name)}`;
			document.querySelectorAll('.profile img').forEach(img => img.src = avatarUrl);

			await loadCourses();
		} else {
			window.location.href = '/';
		}
	} catch (err) {
		console.error(err);
		window.location.href = '/';
	}
}

async function loadCourses() {
	try {
		console.log('Lade Kurse...');

		const allRes = await fetch('/api/courses', { credentials: 'include' });
		allCourses = await allRes.json();

		const myRes = await fetch('/api/my-courses', { credentials: 'include' });
		const myCourses = await myRes.json();
		enrolledCourseIds = myCourses.map(c => c.id);

		console.log('Alle Kurse:', allCourses.length);
		console.log('Eingeschrieben:', enrolledCourseIds.length);

		displayCourses();
	} catch (err) {
		console.error('Fehler beim Laden der Kurse:', err);
		const container = document.getElementById('coursesContainer');
		container.innerHTML = `
			<div style="text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1;">
				<div style="font-size: 48px; margin-bottom: 12px;">⚠️</div>
				<p>Fehler beim Laden der Kurse</p>
			</div>
		`;
	}
}

function filterCourses(filter) {
	currentFilter = filter;

	document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
	event.target.classList.add('active');

	displayCourses();
}

function displayCourses() {
	const container = document.getElementById('coursesContainer');

	let coursesToShow = allCourses;

	if (currentFilter === 'enrolled') {
		coursesToShow = allCourses.filter(c => enrolledCourseIds.includes(c.id));
	} else if (currentFilter === 'available') {
		coursesToShow = allCourses.filter(c => !enrolledCourseIds.includes(c.id));
	}

	if (coursesToShow.length === 0) {
		let message = 'Keine Kurse gefunden';
		if (currentFilter === 'enrolled') {
			message = 'Du hast dich noch für keine Kurse angemeldet.';
		} else if (currentFilter === 'available') {
			message = 'Keine verfügbaren Kurse.';
		}

		container.innerHTML = `
			<div style="text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1;">
				<div style="font-size: 48px; margin-bottom: 12px;">📚</div>
				<p>${message}</p>
			</div>
		`;
		return;
	}

	container.innerHTML = coursesToShow.map(course => {
		const isEnrolled = enrolledCourseIds.includes(course.id);
		const badgeClass = course.category === 'Development' ? 'blue' : 'yellow';

		return `
			<div class="course-card ${isEnrolled ? 'enrolled' : ''}" data-course-id="${course.id}" style="cursor: pointer;">
				<div class="course-header">
					<div class="course-badge ${badgeClass}">${course.category || 'Coding'}</div>
					${isEnrolled ?
						`<button class="enroll-btn enrolled" onclick="event.stopPropagation(); unenrollCourse(${course.id}); return false;">✓ Abmelden</button>` : // enrolled
						`<button class="enroll-btn primary" onclick="event.stopPropagation(); enrollCourse(${course.id}); return false;">+ Einschreiben</button>` // not enrolled
					}
				</div>
				<h3 class="course-title">${course.title}</h3>
				<p class="course-sub">${course.description || 'Ein interaktiver Programmierkurs'}</p>
				<div class="course-meta" style="margin-top: 16px;">
					<div class="course-stats">${course.total_lessons || 0} Lektionen • ${course.duration || '8h'} • ${course.rating || 4.7}★</div>
				</div>
			</div>
		`;
	}).join('');
	// Add click listeners to course cards
	document.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', function() {
        const courseId = this.getAttribute('data-course-id');
        console.log('📚 Öffne Kurs:', courseId);
        window.location.href = `/kurs.html?id=${courseId}`;
    });
});
}

async function enrollCourse(courseId) {
	try {
		console.log('Einschreiben in Kurs:', courseId);

		const res = await fetch('/api/enroll', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			credentials: 'include',
			body: JSON.stringify({ course_id: courseId })
		});

		const data = await res.json();

		if (data.success) {
			alert(data.message);
			enrolledCourseIds.push(courseId);
			displayCourses();
			console.log('Erfolgreich eingeschrieben');
		} else {
			alert(data.message);
		}
	} catch (err) {
		console.error('Fehler beim Einschreiben:', err);
		alert('Fehler beim Einschreiben');
	}
}

async function unenrollCourse(courseId) {
	if (!confirm('Möchtest du dich wirklich von diesem Kurs abmelden?')) return;

	try {
		console.log('Abmelden von Kurs:', courseId);

		const res = await fetch('/api/unenroll', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			credentials: 'include',
			body: JSON.stringify({ course_id: courseId })
		});

		const data = await res.json();

		if (data.success) {
			alert(data.message);
			enrolledCourseIds = enrolledCourseIds.filter(id => id !== courseId);
			displayCourses();
			console.log('Erfolgreich abgemeldet');
		} else {
			alert(data.message);
		}
	} catch (err) {
		console.error('Fehler beim Abmelden:', err);
		alert('Fehler beim Abmelden');
	}
}

async function logout() {
	if (!confirm('Möchten Sie sich wirklich abmelden?')) return;
	try {
		const res = await fetch('/api/logout', { method:'POST', credentials:'include' });
		const data = await res.json();
		alert(data.message);
		window.location.href = '/';
	} catch(err) {
		console.error(err);
		alert('Fehler beim Abmelden');
	}
}

document.addEventListener('DOMContentLoaded', () => {
	console.log('Kurse Seite lädt...');
	loadAuth();

	const sidebar = document.querySelector('.sidebar-footer');
	if (sidebar && !document.getElementById('logoutBtn')) {
		const btn = document.createElement('button');
		btn.id = 'logoutBtn';
		btn.textContent = '🚪 Abmelden';
		btn.style.cssText = 'width:100%;padding:12px;background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px;transition:all 0.2s;';
		btn.addEventListener('mouseenter', () => {
			btn.style.background = '#ef4444';
			btn.style.color = '#fff';
		});
		btn.addEventListener('mouseleave', () => {
			btn.style.background = 'rgba(239,68,68,0.1)';
			btn.style.color = '#ef4444';
		});
		btn.addEventListener('click', logout);
		sidebar.appendChild(btn);
	}

	console.log('Kurse Seite bereit!');
});
</script>
</body>
</html>
