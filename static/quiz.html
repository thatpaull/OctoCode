<!DOCTYPE html>
<html lang="de">

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Quiz - OctoCode</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
			rel="stylesheet">
		<link rel="stylesheet" href="dashboard.css" />
		<style>
		.quiz-container {
			max-width: 900px;
			margin: 0 auto;
		}

		.quiz-header {
			background: linear-gradient(135deg, #f59e0b, #d97706);
			color: white;
			padding: 2rem;
			border-radius: 16px;
			margin-bottom: 2rem;
			text-align: center;
		}

		.quiz-header h1 {
			margin: 0 0 0.5rem 0;
			font-size: 2rem;
		}

		.quiz-progress {
			background: white;
			padding: 1.5rem;
			border-radius: 12px;
			margin-bottom: 2rem;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
		}

		.progress-bar-quiz {
			height: 10px;
			background: #e5e7eb;
			border-radius: 10px;
			overflow: hidden;
			margin-top: 1rem;
		}

		.progress-fill-quiz {
			height: 100%;
			background: linear-gradient(90deg, var(--accent), var(--accent-2));
			transition: width 0.5s;
		}

		.question-card {
			background: white;
			padding: 2rem;
			border-radius: 16px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
			margin-bottom: 2rem;
		}

		.question-number {
			color: var(--accent);
			font-weight: 800;
			font-size: 1.1rem;
			margin-bottom: 1rem;
		}

		.question-text {
			font-size: 1.3rem;
			font-weight: 700;
			margin-bottom: 2rem;
			color: var(--text);
		}

		.options {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		.option {
			padding: 1.5rem;
			border: 3px solid #e5e7eb;
			border-radius: 12px;
			cursor: pointer;
			transition: all 0.3s;
			font-weight: 600;
		}

		.option:hover {
			border-color: var(--accent);
			background: #f0f9ff;
		}

		.option.selected {
			border-color: var(--accent);
			background: linear-gradient(135deg, #dbeafe, #e0e7ff);
		}

		.option.correct {
			border-color: var(--success);
			background: #f0fdf4;
		}

		.option.wrong {
			border-color: #ef4444;
			background: #fef2f2;
		}

		.quiz-nav {
			display: flex;
			gap: 1rem;
			justify-content: space-between;
			margin-top: 2rem;
		}

		.btn-nav {
			padding: 1rem 2rem;
			border: none;
			border-radius: 10px;
			font-weight: 700;
			cursor: pointer;
			font-size: 1rem;
		}

		.btn-prev {
			background: #e5e7eb;
			color: var(--text);
		}

		.btn-next,
		.btn-submit {
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: white;
		}

		.btn-nav:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.results-card {
			background: white;
			padding: 3rem;
			border-radius: 16px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
			text-align: center;
		}

		.score-circle {
			width: 200px;
			height: 200px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 2rem auto;
			font-size: 3rem;
			font-weight: 800;
			color: white;
		}

		.score-circle.passed {
			background: linear-gradient(135deg, var(--success), #059669);
		}

		.score-circle.failed {
			background: linear-gradient(135deg, #ef4444, #dc2626);
		}

		.explanation {
			background: #f9fafb;
			padding: 1rem;
			border-radius: 10px;
			margin-top: 1rem;
			border-left: 4px solid var(--accent);
		}
	</style>
	</head>

	<body>
		<div class="app">
			<!-- SIDEBAR -->
			<aside class="sidebar">
				<div class="brand">
					<div class="logo">OC</div>
					<div class="brand-text">
						<div class="name">OctoCode</div>
						<div class="sub">Premium</div>
					</div>
				</div>

				<nav class="nav">
					<ul>
						<li class="nav-item"><a href="/dashboard.html"
								style="color: inherit; text-decoration: none;">Dashboard</a></li>
						<li class="nav-item active"><a href="/kurse.html"
								style="color: inherit; text-decoration: none;">Kurse</a></li>
						<li class="nav-item">Bewertungen</li>
						<li class="nav-item"><a href="/ai.html"
								style="color: inherit; text-decoration: none;">AI</a></li>
						<li class="nav-item">Freunde</li>
						<li class="nav-item">Einstellungen</li>
					</ul>
				</nav>

				<div class="sidebar-footer">
					<div class="profile">
						<img id="sidebarAvatar" src="img/kid-avatar.jpg" alt="avatar" />
						<div>
							<div class="prof-name" id="sidebarName">User</div>
						</div>
					</div>
				</div>
			</aside>

			<!-- MAIN -->
			<main class="main">
				<div class="quiz-container">
					<button class="btn-back" onclick="goBack()"
						style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: white; border: 2px solid #e5e7eb; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 1.5rem;">
						← Zurück
					</button>

					<!-- Quiz Header --->
					<div class="quiz-header" id="quizHeader">
						<h1>🎓 Quiz</h1>
						<p>Teste dein Wissen!</p>
					</div>

					<!-- Progress -->
					<div class="quiz-progress" id="progressSection" style="display: none;">
						<div
							style="display: flex; justify-content: space-between; align-items: center;">
							<span style="font-weight: 700;">Frage <span id="currentQ">1</span> von
								<span
									id="totalQ">0</span></span>
							<span style="color: var(--muted);" id="progressText">0%
								abgeschlossen</span>
						</div>
						<div class="progress-bar-quiz">
							<div class="progress-fill-quiz" id="progressFill"></div>
						</div>
					</div>

					<!-- Question -->
					<div id="questionSection" style="display: none;"></div>

					<!-- Results -->
					<div id="resultsSection" style="display: none;"></div>
				</div>
			</main>
		</div>

		<script>
let quizData = null;
let currentQuestionIndex = 0;
let userAnswers = {};
let quizId = null;
let showingResults = false;
let dbQuizId = null; // Store database quiz ID

// Get quiz ID and parameters
const urlParams = new URLSearchParams(window.location.search);
quizId = urlParams.get('id');
const questionCount = urlParams.get('count') || 10;
const difficulty = urlParams.get('difficulty') || 'medium';

if (!quizId) {
	alert('Kein Quiz ausgewählt');
	window.location.href = '/kurse.html';
}

// Auth
async function checkAuth() {
	try {
		const res = await fetch('/api/check-auth', { credentials: 'include' });
		const data = await res.json();
		if (!data.authenticated) {
			window.location.href = '/index.html';
			return;
		}
		document.getElementById('sidebarName').textContent = data.user.name;
		if (data.user.avatar_url) {
			document.getElementById('sidebarAvatar').src = data.user.avatar_url;
		}
	} catch (err) {
		console.error('Auth error:', err);
	}
}

// Show loading state
function showLoadingState() {
	const questionSection = document.getElementById('questionSection');
	questionSection.style.display = 'block';
	questionSection.innerHTML = `
		<div class="question-card" style="text-align: center; padding: 3rem;">
			<div style="display: inline-block; width: 80px; height: 80px; border: 8px solid #f3f4f6; border-top: 8px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 2rem;"></div>
			<h2 style="color: var(--text); margin-bottom: 1rem;">🤖 KI generiert dein Quiz...</h2>
			<p style="color: var(--muted); font-size: 1.1rem; margin-bottom: 0.5rem;">
				Bitte warte einen Moment
			</p>
			<p style="color: var(--muted); font-size: 0.95rem;">
				Wir erstellen ${questionCount} individuelle Fragen für dich
			</p>
			<div style="margin-top: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #dbeafe, #e0e7ff); border-radius: 12px; max-width: 500px; margin-left: auto; margin-right: auto;">
				<p style="margin: 0; color: #1e40af; font-weight: 600;">
					💡 Tipp: Die Fragen werden jedes Mal neu generiert und sind einzigartig!
				</p>
			</div>
		</div>
		<style>
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
		</style>
	`;
}

// Load quiz
async function loadQuiz() {
	try {
		// Show loading state immediately
		showLoadingState();

		console.log('📚 Loading quiz:', quizId, 'Questions:', questionCount, 'Difficulty:', difficulty);

		const res = await fetch(`/api/quizzes/${quizId}?count=${questionCount}&difficulty=${difficulty}`, {
			credentials: 'include'
		});
		const data = await res.json();

		if (!data.success) {
			alert('Quiz nicht gefunden');
			window.location.href = '/kurse.html';
			return;
		}

		quizData = data.quiz;
		dbQuizId = data.quiz.db_id; // Store the database ID

		console.log('✅ Quiz loaded:', quizData);

		document.querySelector('#quizHeader h1').textContent = `🎓 ${quizData.title}`;

		// Show difficulty badge
		const difficultyBadges = {
			'easy': '😊 Einfach',
			'medium': '😐 Mittel',
			'hard': '😅 Schwer',
			'adaptive': '🤖 Adaptiv'
		};

		document.querySelector('#quizHeader p').innerHTML = `
			Teste dein Wissen!
			<span style="display: inline-block; margin-left: 1rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border-radius: 20px; font-weight: 700;">
				${difficultyBadges[quizData.difficulty] || '😐 Mittel'}
			</span>
		`;

		document.getElementById('totalQ').textContent = quizData.questions.length;

		document.getElementById('progressSection').style.display = 'block';
		showQuestion();

	} catch (err) {
		console.error('Error:', err);
		const questionSection = document.getElementById('questionSection');
		questionSection.innerHTML = `
			<div class="question-card" style="text-align: center; padding: 3rem;">
				<div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
				<h2 style="color: var(--text); margin-bottom: 1rem;">Fehler beim Laden des Quiz</h2>
				<p style="color: var(--muted); margin-bottom: 2rem;">
					${err.message || 'Ein unbekannter Fehler ist aufgetreten'}
				</p>
				<button class="btn-nav btn-submit" onclick="window.location.href='/kurse.html'">
					Zurück zu Kursen
				</button>
			</div>
		`;
	}
}

// Show question
function showQuestion() {
	const question = quizData.questions[currentQuestionIndex];
	document.getElementById('currentQ').textContent = currentQuestionIndex + 1;

	const progress = ((currentQuestionIndex + 1) / quizData.questions.length) * 100;
	document.getElementById('progressText').textContent = `${Math.round(progress)}% abgeschlossen`;
	document.getElementById('progressFill').style.width = `${progress}%`;

	const section = document.getElementById('questionSection');
	section.style.display = 'block';

	// Determine question type display
	const isCodeQuestion = question.type === 'code';
	const difficultyEmoji = {
		'easy': '😊',
		'medium': '😐',
		'hard': '😅'
	};

	section.innerHTML = `
		<div class="question-card">
			<div class="question-number">
				Frage ${currentQuestionIndex + 1}
				<span style="margin-left: 1rem; padding: 0.25rem 0.75rem; background: #f3f4f6; border-radius: 12px; font-size: 0.9rem;">
					${difficultyEmoji[question.difficulty] || '😐'} ${question.difficulty || 'Medium'}
				</span>
				${isCodeQuestion ? `
					<span style="margin-left: 0.5rem; padding: 0.25rem 0.75rem; background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #7c3aed; border-radius: 12px; font-size: 0.9rem; font-weight: 700;">
						💻 Code
					</span>
				` : ''}
			</div>
			<div class="question-text">${question.question}</div>

			${isCodeQuestion && question.code ? `
				<div style="background: #1e293b; color: #e2e8f0; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; font-family: 'Courier New', monospace; overflow-x: auto;">
					<pre style="margin: 0; white-space: pre-wrap;">${escapeHtml(question.code)}</pre>
				</div>
			` : ''}

			<div class="options">
				${question.options.map((option, index) => `
					<div class="option ${userAnswers[question.id] === index ? 'selected' : ''}"
						 onclick="selectAnswer(${question.id}, ${index})">
						${String.fromCharCode(65 + index)}. ${option}
					</div>
				`).join('')}
			</div>

			<div class="quiz-nav">
				<button class="btn-nav btn-prev"
						onclick="previousQuestion()"
						${currentQuestionIndex === 0 ? 'disabled' : ''}>
					← Zurück
				</button>

				${currentQuestionIndex === quizData.questions.length - 1 ? `
					<button class="btn-nav btn-submit" onclick="submitQuiz()">
						Quiz abschließen →
					</button>
				` : `
					<button class="btn-nav btn-next" onclick="nextQuestion()">
						Weiter →
					</button>
				`}
			</div>
		</div>
	`;
}

// Helper function to escape HTML
function escapeHtml(text) {
	const div = document.createElement('div');
	div.textContent = text;
	return div.innerHTML;
}

// Select answer
function selectAnswer(questionId, answerIndex) {
	userAnswers[questionId] = answerIndex;
	showQuestion();
}

// Navigation
function previousQuestion() {
	if (currentQuestionIndex > 0) {
		currentQuestionIndex--;
		showQuestion();
	}
}

function nextQuestion() {
	if (currentQuestionIndex < quizData.questions.length - 1) {
		currentQuestionIndex++;
		showQuestion();
	}
}

// Submit quiz
async function submitQuiz() {
	// Check all answered
	const unanswered = quizData.questions.filter(q => userAnswers[q.id] === undefined);
	if (unanswered.length > 0) {
		if (!confirm(`Du hast ${unanswered.length} Frage(n) noch nicht beantwortet. Trotzdem abschließen?`)) {
			return;
		}
	}

	try {
		const res = await fetch(`/api/quizzes/${quizId}/submit`, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			credentials: 'include',
			body: JSON.stringify({
				answers: userAnswers,
				db_id: dbQuizId // Include the database quiz ID
			})
		});

		const data = await res.json();
		if (data.success) {
			showResults(data);
		}
	} catch (err) {
		console.error('Error:', err);
		alert('Fehler beim Einreichen');
	}
}

// Show results
function showResults(data) {
	showingResults = true;
	document.getElementById('progressSection').style.display = 'none';
	document.getElementById('questionSection').style.display = 'none';

	const section = document.getElementById('resultsSection');
	section.style.display = 'block';

	section.innerHTML = `
		<div class="results-card">
			<h1>${data.passed ? '🎉 Bestanden!' : '😔 Nicht bestanden'}</h1>
			<div class="score-circle ${data.passed ? 'passed' : 'failed'}">
				${data.score}%
			</div>
			<h2>${data.correct} von ${data.total} richtig</h2>
			<p style="color: var(--muted); margin: 1rem 0 2rem 0;">
				Mindestpunktzahl: ${data.passing_score}% ${data.passed ? '✓' : '✗'}
			</p>

			${data.passed ? `
				<p style="font-size: 1.1rem; color: var(--success); font-weight: 600;">
					Glückwunsch! Du hast das Quiz erfolgreich abgeschlossen!
				</p>
			` : `
				<p style="font-size: 1.1rem; color: #ef4444; font-weight: 600;">
					Versuche es nochmal! Du schaffst das!
				</p>
			`}

			${data.ai_feedback ? `
				<div style="background: linear-gradient(135deg, #dbeafe, #e0e7ff); padding: 2rem; border-radius: 12px; margin: 2rem 0; text-align: left;">
					<h3 style="margin: 0 0 1rem 0; display: flex; align-items: center; gap: 0.5rem;">
						🤖 KI-Feedback
					</h3>
					<p style="font-size: 1.05rem; margin-bottom: 1rem; line-height: 1.6;">
						${JSON.parse(data.ai_feedback).message}
					</p>
					<div style="margin-top: 1.5rem;">
						<strong style="display: block; margin-bottom: 0.5rem;">💡 Tipps für dich:</strong>
						<ul style="margin: 0; padding-left: 1.5rem;">
							${JSON.parse(data.ai_feedback).suggestions.map(tip => `<li style="margin: 0.5rem 0;">${tip}</li>`).join('')}
						</ul>
					</div>
					<div style="margin-top: 1.5rem; padding: 1rem; background: white; border-radius: 8px;">
						<strong>📈 Nächster Schritt:</strong> ${JSON.parse(data.ai_feedback).next_steps}
					</div>
					<div style="margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.5); border-radius: 8px;">
						<strong>🎯 Empfohlener Schwierigkeitsgrad:</strong>
						${JSON.parse(data.ai_feedback).next_difficulty === 'easy' ? '😊 Einfach' :
							JSON.parse(data.ai_feedback).next_difficulty === 'hard' ? '😅 Schwer' : '😐 Mittel'}
					</div>
				</div>
			` : ''}

			<div style="margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
				<button class="btn-nav" onclick="goBack()" style="background: #e5e7eb; color: var(--text);">
					Zurück zum Kurs
				</button>
				${!data.passed ? `
					<button class="btn-nav" onclick="retryQuiz()" style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white;">
						Nochmal versuchen
					</button>
				` : ''}
			</div>

			<div style="margin-top: 3rem; text-align: left;">
				<h3>📊 Ergebnisse im Detail:</h3>
				${data.results.map((result, index) => `
					<div style="background: ${result.correct ? '#f0fdf4' : '#fef2f2'}; padding: 1rem; border-radius: 10px; margin: 1rem 0; border-left: 4px solid ${result.correct ? 'var(--success)' : '#ef4444'};">
						<strong>Frage ${index + 1}: ${result.correct ? '✓ Richtig' : '✗ Falsch'}</strong>
						<div class="explanation">
							💡 ${result.explanation}
						</div>
					</div>
				`).join('')}
			</div>
		</div>
	`;
}

// Retry quiz
function retryQuiz() {
	window.location.reload();
}

// Go back
function goBack() {
	const courseId = quizId.replace('quiz_', '').split('_')[0];
	window.location.href = `/kurs.html?id=${courseId}`;
}

// Init
checkAuth();
loadQuiz();

	</script>
	</body>

</html>
