<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Lehrer-Aufgaben | OctoCode</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="dashboard.css" />
	<style>
		.assignments-container {
			padding: 20px;
		}

		.assignments-header {
			margin-bottom: 32px;
		}

		.assignments-header h1 {
			font-size: 32px;
			font-weight: 800;
			color: var(--text);
			margin-bottom: 8px;
		}

		.assignments-header .subtitle {
			color: var(--muted);
			font-size: 16px;
		}

		.filter-tabs {
			display: flex;
			gap: 12px;
			margin-bottom: 24px;
			flex-wrap: wrap;
		}

		.filter-tab {
			padding: 10px 20px;
			border-radius: 10px;
			border: 2px solid #e2e8f0;
			background: white;
			font-weight: 600;
			font-size: 14px;
			cursor: pointer;
			transition: all 0.2s;
		}

		.filter-tab:hover {
			border-color: #667eea;
			background: #f8fafc;
		}

		.filter-tab.active {
			background: linear-gradient(135deg, #667eea, #764ba2);
			color: white;
			border-color: transparent;
		}

		.assignments-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
			gap: 20px;
		}

		.assignment-card {
			background: var(--surface);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			overflow: hidden;
			transition: all 0.3s;
			cursor: pointer;
			border: 2px solid transparent;
		}

		.assignment-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 12px 40px rgba(0,0,0,0.12);
			border-color: #667eea;
		}

		.assignment-card-header {
			padding: 20px;
			border-bottom: 2px solid #f1f5f9;
		}

		.assignment-badge {
			display: inline-block;
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 12px;
			font-weight: 700;
			margin-bottom: 12px;
		}

		.assignment-title {
			font-size: 18px;
			font-weight: 700;
			color: var(--text);
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.assignment-meta {
			display: flex;
			gap: 16px;
			font-size: 13px;
			color: var(--muted);
			flex-wrap: wrap;
		}

		.assignment-meta-item {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.assignment-card-body {
			padding: 20px;
		}

		.assignment-info {
			display: flex;
			gap: 12px;
			margin-bottom: 16px;
			flex-wrap: wrap;
		}

		.info-chip {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 6px 12px;
			border-radius: 8px;
			background: #f8fafc;
			font-size: 12px;
			font-weight: 600;
			color: #475569;
		}

		.assignment-status {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 12px;
			border-radius: 10px;
			font-weight: 600;
			margin-bottom: 16px;
		}

		.assignment-status.completed {
			background: linear-gradient(135deg, #d1fae5, #a7f3d0);
			color: #065f46;
		}

		.assignment-status.pending {
			background: linear-gradient(135deg, #fef3c7, #fde68a);
			color: #78350f;
		}

		.assignment-btn {
			width: 100%;
			padding: 14px;
			border-radius: 12px;
			border: none;
			font-weight: 700;
			font-size: 14px;
			cursor: pointer;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		.assignment-btn.primary {
			background: linear-gradient(135deg, #667eea, #764ba2);
			color: white;
		}

		.assignment-btn.primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
		}

		.assignment-btn.secondary {
			background: #f1f5f9;
			color: #475569;
		}

		.assignment-btn.secondary:hover {
			background: #e2e8f0;
		}

		.score-display {
			text-align: center;
			margin: 16px 0;
		}

		.score-value {
			font-size: 48px;
			font-weight: 800;
			line-height: 1;
		}

		.score-label {
			font-size: 12px;
			color: var(--muted);
			margin-top: 4px;
			text-transform: uppercase;
			font-weight: 600;
		}

		.empty-state {
			text-align: center;
			padding: 80px 20px;
			color: var(--muted);
		}

		.empty-state svg {
			margin-bottom: 24px;
			opacity: 0.3;
		}

		.empty-state h3 {
			margin: 0;
			font-size: 24px;
			color: var(--text);
		}

		.empty-state p {
			margin: 12px 0 0 0;
			font-size: 16px;
		}

		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			backdrop-filter: blur(4px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 9999;
		}

		.loading-content {
			background: white;
			border-radius: 20px;
			padding: 40px;
			text-align: center;
			max-width: 400px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.3);
		}

		.loading-spinner {
			width: 60px;
			height: 60px;
			border: 4px solid #f1f5f9;
			border-top-color: #667eea;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin: 0 auto 24px;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		.loading-text {
			font-size: 18px;
			font-weight: 700;
			color: var(--text);
			margin-bottom: 8px;
		}

		.loading-subtext {
			font-size: 14px;
			color: var(--muted);
		}

		.stats-summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
			margin-bottom: 32px;
		}

		.stat-box {
			background: white;
			padding: 20px;
			border-radius: 12px;
			box-shadow: var(--shadow);
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.stat-box-value {
			font-size: 32px;
			font-weight: 800;
		}

		.stat-box-label {
			font-size: 13px;
			color: var(--muted);
			font-weight: 600;
			text-transform: uppercase;
		}

		/* Result Details Modal */
		.modal-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.5);
			backdrop-filter: blur(4px);
			z-index: 9999;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.modal-overlay.active {
			display: flex;
		}

		.modal-content {
			background: white;
			border-radius: 20px;
			max-width: 800px;
			width: 100%;
			max-height: 90vh;
			overflow-y: auto;
			box-shadow: 0 20px 60px rgba(0,0,0,0.3);
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 24px;
			border-bottom: 2px solid #f1f5f9;
		}

		.modal-header h3 {
			margin: 0;
			font-size: 20px;
			font-weight: 800;
		}

		.close-btn {
			width: 36px;
			height: 36px;
			border-radius: 10px;
			border: none;
			background: #f1f5f9;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s;
		}

		.close-btn:hover {
			background: #fee2e2;
			color: #dc2626;
		}

		.modal-body {
			padding: 24px;
		}

		.result-summary {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 16px;
			margin-bottom: 24px;
		}

		.summary-card {
			padding: 16px;
			border-radius: 12px;
			background: #f8fafc;
		}

		.summary-label {
			font-size: 12px;
			color: #64748b;
			margin-bottom: 4px;
		}

		.summary-value {
			font-size: 24px;
			font-weight: 800;
		}
	</style>
</head>
<body>
<div class="app">
	<!-- SIDEBAR -->
	<aside class="sidebar" aria-label="Navbar">
		<div class="brand">
			<div class="logo">OC</div>
			<div class="brand-text">
				<div class="name">OctoCode</div>
				<div class="sub">Premium</div>
			</div>
		</div>

		<nav class="nav">
			<ul>
				<li class="nav-item" onclick="window.location.href='dashboard.html'">Dashboard</li>
				<li class="nav-item" onclick="window.location.href='kurse.html'">Kurse</li>
				<li class="nav-item active" aria-current="page">Lehrer-Aufgaben</li>
				<li class="nav-item" onclick="window.location.href='ai.html'">AI</li>
				<li class="nav-item" onclick="window.location.href='freunde.html'">Freunde</li>
				<li class="nav-item" onclick="window.location.href='einstellungen.html'">Einstellungen</li>
			</ul>
		</nav>

		<div class="sidebar-footer">
			<div class="theme-switch">
				<label class="switch">
					<input id="themeToggle" type="checkbox">
					<span class="slider"></span>
				</label>
				<small>Dunkles Thema</small>
			</div>
			<div class="profile">
				<img src="img/kid-avatar.jpg" alt="avatar" id="sidebarAvatar" />
				<div>
					<div class="prof-name" id="sidebarName">Schüler</div>
					<div class="prof-score" id="sidebarPoints">0 Punkte</div>
				</div>
			</div>
		</div>
	</aside>

	<!-- MAIN -->
	<main class="main">
		<div class="assignments-container">
			<div class="assignments-header">
				<h1>📋 Lehrer-Aufgaben</h1>
				<p class="subtitle">Von deinen Lehrern erstellte Quiz und Aufgaben</p>
			</div>

			<!-- Statistics Summary -->
			<div class="stats-summary" id="statsSummary">
				<div class="stat-box">
					<div class="stat-box-value" id="totalAssignments">0</div>
					<div class="stat-box-label">Gesamt Aufgaben</div>
				</div>
				<div class="stat-box">
					<div class="stat-box-value" style="color: #10b981;" id="completedAssignments">0</div>
					<div class="stat-box-label">Abgeschlossen</div>
				</div>
				<div class="stat-box">
					<div class="stat-box-value" style="color: #f59e0b;" id="pendingAssignments">0</div>
					<div class="stat-box-label">Ausstehend</div>
				</div>
				<div class="stat-box">
					<div class="stat-box-value" style="color: #667eea;" id="avgScore">0%</div>
					<div class="stat-box-label">Durchschnitt</div>
				</div>
			</div>

			<!-- Filter Tabs -->
			<div class="filter-tabs">
				<button class="filter-tab active" onclick="filterAssignments('all')">
					🔍 Alle
				</button>
				<button class="filter-tab" onclick="filterAssignments('pending')">
					⏳ Ausstehend
				</button>
				<button class="filter-tab" onclick="filterAssignments('completed')">
					✅ Abgeschlossen
				</button>
				<button class="filter-tab" onclick="filterAssignments('passed')">
					🎉 Bestanden
				</button>
				<button class="filter-tab" onclick="filterAssignments('failed')">
					❌ Nicht bestanden
				</button>
			</div>

			<div id="assignmentsGrid" class="assignments-grid">
				<!-- Loading state -->
				<div class="empty-state">
					<div class="loading-spinner"></div>
					<h3>Lade Aufgaben...</h3>
				</div>
			</div>
		</div>
	</main>
</div>


<!-- Result Details Modal -->
<div id="resultModal" class="modal-overlay">
	<div class="modal-content">
		<div class="modal-header">
			<h3 id="resultModalTitle">Quiz-Ergebnis</h3>
			<button class="close-btn" onclick="closeResultModal()">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<line x1="18" y1="6" x2="6" y2="18"></line>
					<line x1="6" y1="6" x2="18" y2="18"></line>
				</svg>
			</button>
		</div>
		<div class="modal-body" id="resultModalBody">
			<!-- Content will be inserted here -->
		</div>
	</div>
</div>

<script>

let currentUser = null;
let allAssignments = [];
let currentFilter = 'all';

// Debug mode
const DEBUG = true;
function log(...args) {
	if (DEBUG) console.log(...args);
}

// Load user data
async function loadUserData() {
	log('🔍 loadUserData: Starting...');

	try {
		log('📡 Fetching /api/check-auth...');
		const res = await fetch('/api/check-auth', { credentials: 'include' });

		log('📡 Response status:', res.status);

		if (!res.ok) {
			throw new Error(`HTTP ${res.status}`);
		}

		const data = await res.json();
		log('✅ Auth data:', data);

		if (data.authenticated && data.user.role === 'student') {
			currentUser = data.user;
			log('✅ User authenticated:', currentUser);

			// Update sidebar
			const sidebarName = document.getElementById('sidebarName');
			const sidebarPoints = document.getElementById('sidebarPoints');
			const sidebarAvatar = document.getElementById('sidebarAvatar');

			if (sidebarName) {
				sidebarName.textContent = currentUser.name;
				log('✅ Updated sidebarName:', currentUser.name);
			} else {
				log('❌ sidebarName element not found!');
			}

			if (sidebarPoints) {
				sidebarPoints.textContent = `${currentUser.points || 0} Punkte`;
				log('✅ Updated sidebarPoints:', currentUser.points);
			} else {
				log('❌ sidebarPoints element not found!');
			}

			if (sidebarAvatar) {
				const avatarUrl = currentUser.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(currentUser.name)}`;
				sidebarAvatar.src = avatarUrl;
				log('✅ Updated sidebarAvatar:', avatarUrl);
			} else {
				log('❌ sidebarAvatar element not found!');
			}

			// Load assignments
			await loadAssignments();
		} else {
			log('❌ User not authenticated or not a student');
			alert('Sie sind nicht als Schüler angemeldet!');
			window.location.href = '/';
		}
	} catch (err) {
		log('❌ Auth error:', err);
		console.error('❌ Auth error:', err);
		alert('Fehler beim Laden der Benutzerdaten: ' + err.message);
		// Don't redirect - let user see the error
	}
}

// Load assignments
async function loadAssignments() {
	log('📚 loadAssignments: Starting...');

	try {
		log('📡 Fetching /api/student/teacher-assignments...');
		const res = await fetch('/api/student/teacher-assignments', { credentials: 'include' });

		log('📡 Response status:', res.status);

		if (!res.ok) {
			const errorText = await res.text();
			log('❌ Response error:', errorText);
			throw new Error(`Failed to load assignments: HTTP ${res.status}`);
		}

		const data = await res.json();
		log('📦 Raw API response:', data);

		if (!data.success) {
			throw new Error(data.message || 'API returned success=false');
		}

		allAssignments = data.assignments || [];

		log('✅ Loaded assignments:', allAssignments.length);
		log('📋 Assignments data:', allAssignments);

		updateStatistics();
		renderAssignments();

	} catch (err) {
		log('❌ Load assignments error:', err);
		console.error('❌ Load assignments error:', err);

		const grid = document.getElementById('assignmentsGrid');
		if (grid) {
			grid.innerHTML = `
				<div class="empty-state">
					<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
						<line x1="12" y1="9" x2="12" y2="13"></line>
						<line x1="12" y1="17" x2="12.01" y2="17"></line>
					</svg>
					<h3>Fehler beim Laden</h3>
					<p>${err.message}</p>
					<button onclick="location.reload()" style="margin-top: 16px; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">Erneut versuchen</button>
				</div>
			`;
		}
	}
}

// Update statistics
function updateStatistics() {
	log('📊 updateStatistics: Starting...');

	const total = allAssignments.length;
	const completed = allAssignments.filter(a => a.completed).length;
	const pending = total - completed;

	const completedAssignments = allAssignments.filter(a => a.completed && a.score !== null);
	const avgScore = completedAssignments.length > 0
		? Math.round(completedAssignments.reduce((sum, a) => sum + a.score, 0) / completedAssignments.length)
		: 0;

	log('📊 Stats:', { total, completed, pending, avgScore });

	// Update DOM
	const totalEl = document.getElementById('totalAssignments');
	const completedEl = document.getElementById('completedAssignments');
	const pendingEl = document.getElementById('pendingAssignments');
	const avgScoreEl = document.getElementById('avgScore');

	if (totalEl) {
		totalEl.textContent = total;
		log('✅ Updated totalAssignments:', total);
	} else {
		log('❌ totalAssignments element not found!');
	}

	if (completedEl) {
		completedEl.textContent = completed;
		log('✅ Updated completedAssignments:', completed);
	} else {
		log('❌ completedAssignments element not found!');
	}

	if (pendingEl) {
		pendingEl.textContent = pending;
		log('✅ Updated pendingAssignments:', pending);
	} else {
		log('❌ pendingAssignments element not found!');
	}

	if (avgScoreEl) {
		avgScoreEl.textContent = `${avgScore}%`;
		log('✅ Updated avgScore:', avgScore + '%');
	} else {
		log('❌ avgScore element not found!');
	}
}

// Filter assignments
function filterAssignments(filter) {
	log('🔍 filterAssignments:', filter);
	currentFilter = filter;

	// Update active tab
	document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
	event.target.classList.add('active');

	renderAssignments();
}

// Get filtered assignments
function getFilteredAssignments() {
	switch(currentFilter) {
		case 'pending':
			return allAssignments.filter(a => !a.completed);
		case 'completed':
			return allAssignments.filter(a => a.completed);
		case 'passed':
			return allAssignments.filter(a => a.completed && a.passed);
		case 'failed':
			return allAssignments.filter(a => a.completed && !a.passed);
		default:
			return allAssignments;
	}
}

// Format date
function formatDate(dateString) {
	if (!dateString) return 'N/A';

	try {
		const date = new Date(dateString);
		const day = date.getDate();
		const month = date.getMonth() + 1;
		const year = date.getFullYear();
		return `${day}.${month}.${year}`;
	} catch (e) {
		return dateString;
	}
}

// Render assignments
function renderAssignments() {
	log('🎨 renderAssignments: Starting...');

	const grid = document.getElementById('assignmentsGrid');

	if (!grid) {
		log('❌ assignmentsGrid element not found!');
		return;
	}

	const assignments = getFilteredAssignments();
	log('📋 Rendering', assignments.length, 'assignments');

	if (assignments.length === 0) {
		const emptyMessages = {
			'all': 'Keine Aufgaben verfügbar',
			'pending': 'Keine ausstehenden Aufgaben',
			'completed': 'Noch keine Aufgaben abgeschlossen',
			'passed': 'Noch keine bestandenen Aufgaben',
			'failed': 'Keine nicht bestandenen Aufgaben'
		};

		grid.innerHTML = `
			<div class="empty-state">
				<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
					<polyline points="14 2 14 8 20 8"></polyline>
					<line x1="16" y1="13" x2="8" y2="13"></line>
					<line x1="16" y1="17" x2="8" y2="17"></line>
					<polyline points="10 9 9 9 8 9"></polyline>
				</svg>
				<h3>${emptyMessages[currentFilter]}</h3>
				<p>${currentFilter === 'all' ? 'Deine Lehrer haben noch keine Quiz-Aufgaben erstellt' : 'Ändere den Filter, um andere Aufgaben zu sehen'}</p>
			</div>
		`;
		log('ℹ️  Showing empty state for filter:', currentFilter);
		return;
	}

	grid.innerHTML = assignments.map((assignment, index) => {
		log(`🎨 Rendering assignment ${index + 1}:`, assignment);

		const isCompleted = assignment.completed;
		const statusClass = isCompleted ? 'completed' : 'pending';
		const statusIcon = isCompleted ? '✅' : '⏳';
		const statusText = isCompleted
			? `Abgeschlossen: ${assignment.score}%`
			: 'Noch nicht abgeschlossen';

		const badgeColor = assignment.course_color || '#667eea';
		const questionCount = assignment.questions_count || '?';

		return `
			<div class="assignment-card" onclick="openAssignment(${assignment.id})">
				<div class="assignment-card-header">
					<div class="assignment-badge" style="background-color: ${badgeColor}20; color: ${badgeColor};">
						📚 ${assignment.course_title || 'Kurs'}
					</div>
					<div class="assignment-title">
						📄 ${assignment.title}
					</div>
					<div class="assignment-meta">
						<div class="assignment-meta-item">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
								<circle cx="12" cy="8" r="4"></circle>
							</svg>
							${assignment.teacher_name || 'Lehrer'}
						</div>
						<div class="assignment-meta-item">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<circle cx="12" cy="12" r="10"></circle>
								<polyline points="12 6 12 12 16 14"></polyline>
							</svg>
							${formatDate(assignment.created_at)}
						</div>
					</div>
				</div>
				<div class="assignment-card-body">
					<div class="assignment-info">
						<div class="info-chip">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
								<polyline points="14 2 14 8 20 8"></polyline>
							</svg>
							PDF-Quiz
						</div>
						<div class="info-chip">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<circle cx="12" cy="12" r="10"></circle>
								<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
								<line x1="12" y1="17" x2="12.01" y2="17"></line>
							</svg>
							${questionCount} Fragen
						</div>
					</div>

					<div class="assignment-status ${statusClass}">
						<span style="font-size: 20px;">${statusIcon}</span>
						<span>${statusText}</span>
					</div>

					${isCompleted ? `
						<div class="score-display">
							<div class="score-value" style="color: ${assignment.passed ? '#10b981' : '#ef4444'};">
								${assignment.score}%
							</div>
							<div class="score-label">
								${assignment.passed ? '🎉 Bestanden' : '😔 Nicht bestanden'}
							</div>
						</div>
						<button class="assignment-btn secondary" onclick="event.stopPropagation(); viewResults(${assignment.id})">
							📊 Ergebnisse ansehen
						</button>
					` : `
						<button class="assignment-btn primary" onclick="event.stopPropagation(); startAssignment(${assignment.id})">
							▶️ Quiz starten
						</button>
					`}
				</div>
			</div>
		`;
	}).join('');

	log('✅ Rendered', assignments.length, 'assignment cards');
}

// Start assignment
function startAssignment(assignmentId) {
	log('🎯 startAssignment:', assignmentId);
	window.location.href = `quiz.html?assignment_id=${assignmentId}`;
}

// View results
function viewResults(assignmentId) {
	log('📊 viewResults:', assignmentId);
	const assignment = allAssignments.find(a => a.id === assignmentId);
	if (!assignment || !assignment.completed) {
		alert('Keine Ergebnisse verfügbar');
		return;
	}

	alert(`Ergebnis: ${assignment.score}% (${assignment.passed ? 'Bestanden' : 'Nicht bestanden'})`);
}

// Open assignment
function openAssignment(assignmentId) {
	log('🔗 openAssignment:', assignmentId);
	startAssignment(assignmentId);
}

// Close result modal
function closeResultModal() {
	const modal = document.getElementById('resultModal');
	if (modal) modal.style.display = 'none';
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => {
	log('🚀 DOMContentLoaded fired');
	log('📍 Current URL:', window.location.href);
	log('🌐 Cookies:', document.cookie);

	// Check if all required elements exist
	const requiredElements = [
		'sidebarName', 'sidebarPoints', 'sidebarAvatar',
		'totalAssignments', 'completedAssignments', 'pendingAssignments', 'avgScore',
		'assignmentsGrid'
	];

	requiredElements.forEach(id => {
		const el = document.getElementById(id);
		if (!el) {
			log(`❌ Required element missing: ${id}`);
		} else {
			log(`✅ Found element: ${id}`);
		}
	});

	loadUserData();
});

log('✅ Script loaded successfully');
</script>
</body>
</html>
